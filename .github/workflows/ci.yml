name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit Tests & Scenario Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest

      - name: Run scenario free checker
        run: |
          python -m claudarama.scenario scenarios

      - name: Run scenario sealing check
        run: |
          python scripts/check_sealing.py --base origin/${{ github.base_ref }}
