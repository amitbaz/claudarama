[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claudarama"
version = "0.1.0"
description = "A Claude Code plugin that runs an AI startup for a software project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
